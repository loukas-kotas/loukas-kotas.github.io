<section id="skills">
  <div class="skills-container center">
    <h3 class="section-title">{{skillsData.title}}</h3>

    <div class="badges-grid">
      <div class="badge-group" *ngFor="let badge of badges">
        <app-skill-budges [title]="badge.title" [iconTitles]="badge.iconTitles" [tooltipTitles]="badge.tooltipTitles"></app-skill-budges>
      </div>
    </div>
  </div>
</section>
